name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stocksense-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q --cov=app --cov-report=json:coverage.json --cov-fail-under=85

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PYEOF'
          import json
          cov = json.load(open("coverage.json"))
          pct = round(cov["totals"]["percent_covered"])
          color = "brightgreen" if pct >= 85 else "yellow" if pct >= 70 else "red"
          json.dump({"schemaVersion": 1, "label": "coverage",
                     "message": f"{pct}%", "color": color},
                    open("badge-endpoint.json", "w"))
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          git checkout -B badges origin/badges 2>/dev/null || git checkout --orphan badges
          git rm -rf . 2>/dev/null || true
          mv -f badge-endpoint.json coverage.json
          git add coverage.json
          git commit -m "coverage badge: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no change"
          git push origin badges

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build

  reproducibility-evaluation:
    name: Reproducible sample-data evaluation
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run walk-forward evaluation on checked-in sample data
        run: python -m app.services.training --data-path data/sample_prices.csv --limit 1000 --model-version ci-sample-v1
      - name: Verify evaluation evidence
        run: python scripts/verify_sample_evidence.py
      - name: Upload evaluation evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stocksense-sample-evaluation
          path: |
            models/metrics.json
            models/registry.json
            models/walk_forward_predictions.csv
            models/evidence_verification.json
          if-no-files-found: error
