name: Model Evaluation

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: Ticker to evaluate
        required: true
        default: AAPL
      rows:
        description: Historical rows to retrieve
        required: true
        default: "1000"

permissions:
  contents: read

concurrency:
  group: stocksense-model-evaluation-${{ inputs.symbol }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: research

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Walk-forward evaluation
        env:
          MARKET_DATA_PROVIDER: twelve_data
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          python -m app.services.training \
            --symbol "${{ inputs.symbol }}" \
            --provider twelve_data \
            --limit "${{ inputs.rows }}"

      - name: Publish metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v7.0.1
        with:
          name: stocksense-model-evaluation-${{ inputs.symbol }}-${{ github.sha }}
          path: |
            models/metrics.json
            models/registry.json
            models/walk_forward_predictions.csv
